  <path fill="none" stroke="#4DC3C2" stroke-width="7" stroke-linecap="round"
        d="M42 50a9 9 0 0 1 16 0"/>
  <path fill="none" stroke="#4DC3C2" stroke-width="7" stroke-linecap="round"
        d="M31 49a20 20 0 0 1 38 0"/>
  <path fill="none" stroke="#4DC3C2" stroke-width="7" stroke-linecap="round"
