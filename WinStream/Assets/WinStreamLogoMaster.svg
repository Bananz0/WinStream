<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title">
  <title id="title">WinStream</title>
  <!-- Curved panes form one energetic Windows-inspired silhouette. -->
  <path fill="#076F74" d="M8 29 44 47v14L9 56z"/>
  <path fill="#232B30" d="m92 29-36 18v14l35-5z"/>
  <path fill="#076F74" d="m9 60 34 5-12 26-23 8z"/>
  <path fill="#232B30" d="m91 60-34 5 12 26 23 8z"/>
